include:
  - path: ./docker-compose.api.yml

services:
  deploy-path-guard:
    image: alpine:3.22
    working_dir: /workspace
    command: >
      sh -ec 'host="$$(cat /host/etc-hostname 2>/dev/null || hostname)";
      if [ "$$host" = "hanasand" ] || [ "$$host" = "inspur" ]; then
        test "$$HANASAND_DEPLOY_GUARD_CWD" = "/home/hanasand/hanasand";
        test -e /workspace/.git;
      fi;
      sleep infinity'
    environment:
      HANASAND_DEPLOY_GUARD_CWD: ${HANASAND_DEPLOY_GUARD_ROOT:-${PWD:-}}
    volumes:
      # The guard outlives the temporary release build directory.
      - ${HANASAND_DEPLOY_GUARD_ROOT:-.}:/workspace:ro
      - /etc/hostname:/host/etc-hostname:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "host=$$(cat /host/etc-hostname 2>/dev/null || hostname); if [ \"$$host\" = \"hanasand\" ] || [ \"$$host\" = \"inspur\" ]; then test \"$$HANASAND_DEPLOY_GUARD_CWD\" = \"/home/hanasand/hanasand\" && test -e /workspace/.git; fi",
        ]
      interval: 5s
      retries: 3

  frontend:
    container_name: hanasand
    image: hanasand
    mem_limit: 2g
    cpus: "2.0"
    restart: always
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        HANASAND_RELEASE_COMMIT: ${HANASAND_RELEASE_COMMIT:-unknown}
        FRONTEND_INTERNAL_API: ${FRONTEND_INTERNAL_API:-http://api:8080/api}
    env_file:
      - ${HANASAND_DEPLOY_ENV_FILE:-.env}
    environment:
      FRONTEND_AUTH_API: ${FRONTEND_AUTH_API:-https://api.hanasand.com/api}
      FRONTEND_IDENTITY_API: ${FRONTEND_IDENTITY_API:-http://identity:8081/api}
      FRONTEND_INTERNAL_API: ${FRONTEND_INTERNAL_API:-http://api:8080/api}
      FRONTEND_INTERNAL_AI_API: ${FRONTEND_INTERNAL_AI_API:-http://ai:19182/api}
      TI_SCRAPER_API_BASE: ${TI_SCRAPER_API_BASE:-http://ti-scraper:8097}
      MAIL_JMAP_INTERNAL_URL: ${MAIL_JMAP_INTERNAL_URL:-http://stalwart:8080}
      MAIL_PUBLIC_BASE_URL: ${MAIL_PUBLIC_BASE_URL:-https://mail.hanasand.com}
      MAIL_INBOX_USERNAME: ${MAIL_INBOX_USERNAME:-eirik}
      MAIL_INBOX_ADDRESS: ${MAIL_INBOX_ADDRESS:-contact@hanasand.com}
      MAIL_INBOX_PASSWORD: ${MAIL_INBOX_PASSWORD:-}
      HANASAND_RELEASE_COMMIT: ${HANASAND_RELEASE_COMMIT:-unknown}
    ports:
      - "3000:3000"
      # Keep the stable host-side frontend port used by the production proxy.
      - "127.0.0.1:3100:3000"
    volumes:
      - prompt_portal_state:/var/lib/hanasand-prompt
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health"]
      start_period: 30s
      interval: 5s
      retries: 5
    networks:
      hanasandnet:
        gw_priority: 1
      identity-proxy: {}
    depends_on:
      deploy-path-guard:
        condition: service_healthy

  # These profile-only services are started explicitly during a serialized
  # release. They let the proxy switch to a fully healthy pair before the
  # canonical frontend and API containers are replaced.
  frontend-candidate:
    extends:
      service: frontend
    container_name: ${HANASAND_FRONTEND_CANDIDATE_CONTAINER:-hanasand_frontend_candidate}
    environment:
      FRONTEND_INTERNAL_API: http://${HANASAND_API_CANDIDATE_CONTAINER:-hanasand_api_candidate}:8080/api
    ports: !override
      - "127.0.0.1:${HANASAND_FRONTEND_CANDIDATE_PORT:-3101}:3000"
    profiles: [deployment-candidates]

  postgres:
    image: postgres:15
    container_name: hanasand_database
    # Startup arguments also apply to restored volumes, overriding old ALTER SYSTEM values.
    command:
      - postgres
      - -c
      - shared_buffers=${DB_SHARED_BUFFERS:-32GB}
      - -c
      - track_activity_query_size=64kB
      - -c
      - effective_cache_size=48GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_wal_size=32GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=zstd
      - -c
      - wal_buffers=16MB
      - -c
      - max_slot_wal_keep_size=64GB
      - -c
      - gin_pending_list_limit=4MB
      - -c
      - bgwriter_lru_maxpages=100
      - -c
      - bgwriter_delay=200ms
      - -c
      - bgwriter_lru_multiplier=2
      - -c
      - fsync=on
      - -c
      - full_page_writes=on
      - -c
      - synchronous_commit=on
    # Parallel queries share memory here; Docker's 64 MiB default exhausts it.
    shm_size: "2gb"
    mem_limit: 256g
    memswap_limit: 256g
    cpus: "32.0"
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-hanasand}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB:-hanasand}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./db/init:/docker-entrypoint-initdb.d/init:ro
      - ../ops/healthchecks/pg-readiness.sh:/usr/local/bin/pg_isready:ro
    ports:
      - "127.0.0.1:${DB_LOCAL_PORT:-8503}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanasand -d hanasand"]
      interval: 5s
      retries: 5
    networks:
      - hanasandnet
    depends_on:
      deploy-path-guard:
        condition: service_healthy

volumes:
  api_state:
  prompt_portal_state:
  postgres_data:
    external: true
    name: hanasand_postgres_data

networks:
  pwnednet:
    external: true
  hanasandnet:
    driver: bridge
  identity-proxy:
    external: true
    name: hanasand_identity_proxy
