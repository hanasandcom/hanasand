services:
  deploy-path-guard:
    image: alpine:3.22
    working_dir: /workspace
    command: >
      sh -ec 'host="$$(cat /host/etc-hostname 2>/dev/null || hostname)";
      if [ "$$host" = "hanasand" ] || [ "$$host" = "inspur" ]; then
        test "$$HANASAND_DEPLOY_GUARD_CWD" = "/home/hanasand/hanasand";
        test -e /workspace/.git;
      fi;
      sleep infinity'
    environment:
      HANASAND_DEPLOY_GUARD_CWD: ${HANASAND_DEPLOY_GUARD_ROOT:-${PWD:-}}
    volumes:
      # The guard outlives the temporary release build directory.
      - ${HANASAND_DEPLOY_GUARD_ROOT:-.}:/workspace:ro
      - /etc/hostname:/host/etc-hostname:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "host=$$(cat /host/etc-hostname 2>/dev/null || hostname); if [ \"$$host\" = \"hanasand\" ] || [ \"$$host\" = \"inspur\" ]; then test \"$$HANASAND_DEPLOY_GUARD_CWD\" = \"/home/hanasand/hanasand\" && test -e /workspace/.git; fi",
        ]
      interval: 5s
      retries: 3

  frontend:
    container_name: hanasand
    image: hanasand
    mem_limit: 2g
    cpus: "2.0"
    restart: always
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        HANASAND_RELEASE_COMMIT: ${HANASAND_RELEASE_COMMIT:-unknown}
        FRONTEND_INTERNAL_API: ${FRONTEND_INTERNAL_API:-http://api:8080/api}
    env_file:
      - ${HANASAND_DEPLOY_ENV_FILE:-.env}
    environment:
      FRONTEND_AUTH_API: ${FRONTEND_AUTH_API:-https://api.hanasand.com/api}
      FRONTEND_INTERNAL_API: ${FRONTEND_INTERNAL_API:-http://api:8080/api}
      TI_SCRAPER_API_BASE: ${TI_SCRAPER_API_BASE:-http://ti-scraper:8097}
      MAIL_JMAP_INTERNAL_URL: ${MAIL_JMAP_INTERNAL_URL:-http://stalwart:8080}
      MAIL_PUBLIC_BASE_URL: ${MAIL_PUBLIC_BASE_URL:-https://mail.hanasand.com}
      MAIL_INBOX_USERNAME: ${MAIL_INBOX_USERNAME:-eirik}
      MAIL_INBOX_ADDRESS: ${MAIL_INBOX_ADDRESS:-contact@hanasand.com}
      MAIL_INBOX_PASSWORD: ${MAIL_INBOX_PASSWORD:-}
      HANASAND_RELEASE_COMMIT: ${HANASAND_RELEASE_COMMIT:-unknown}
    ports:
      - "3000:3000"
      # Keep the stable host-side frontend port used by the production proxy.
      - "127.0.0.1:3100:3000"
    volumes:
      - prompt_portal_state:/var/lib/hanasand-prompt
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health"]
      start_period: 30s
      interval: 5s
      retries: 5
    networks:
      - hanasandnet
    depends_on:
      deploy-path-guard:
        condition: service_healthy

  # These profile-only services are started explicitly during a serialized
  # release. They let the proxy switch to a fully healthy pair before the
  # canonical frontend and API containers are replaced.
  frontend-candidate:
    extends:
      service: frontend
    container_name: ${HANASAND_FRONTEND_CANDIDATE_CONTAINER:-hanasand_frontend_candidate}
    environment:
      FRONTEND_INTERNAL_API: http://${HANASAND_API_CANDIDATE_CONTAINER:-hanasand_api_candidate}:8080/api
    ports: !override
      - "127.0.0.1:${HANASAND_FRONTEND_CANDIDATE_PORT:-3101}:3000"
    profiles: [deployment-candidates]

  api:
    container_name: hanasand_api
    image: hanasand_api
    mem_limit: 2g
    cpus: "2.0"
    restart: always
    build:
      context: .
      additional_contexts:
        database_schema: ./db
      dockerfile: ./api/Dockerfile
      args:
        HANASAND_RELEASE_COMMIT: ${HANASAND_RELEASE_COMMIT:-unknown}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
      # Keep the stable host-side API port used by the production proxy.
      - "127.0.0.1:8082:8080"
    env_file:
      - ${HANASAND_DEPLOY_ENV_FILE:-.env}
    volumes:
      # Mount the directory so a Docker daemon restart can replace docker.sock
      # without leaving this container attached to the deleted socket inode.
      - /run:/host/run:ro
      - /var/snap/lxd/common/lxd/unix.socket:/var/snap/lxd/common/lxd/unix.socket
      - /var/spool/cron/crontabs:/host/cron/crontabs
      - /var/lib/hanasand:/host/var/lib/hanasand:ro
      - /var/lib/hanasand/docker-storage:/var/lib/hanasand/docker-storage
      - api_state:/var/lib/hanasand
      - ${HANASAND_APP_UPDATE_DIR:-/srv/hanasand/app-updates}:/srv/hanasand/app-updates
      - ${HOST_CONSOLE_SSH_KEY_FILE:-/home/hanasand/.ssh/host-console}:/run/secrets/host-console:ro
      - ${HOST_CONSOLE_KNOWN_HOSTS_FILE:-/home/hanasand/.ssh/host-console-known-hosts}:/run/secrets/host-console-known-hosts:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TI_SCRAPER_API_BASE: ${TI_SCRAPER_API_BASE:-http://ti-scraper:8097}
      LOG_CATCHUP_BATCH_LIMIT: ${LOG_CATCHUP_BATCH_LIMIT:-25}
      LOG_CATCHUP_HISTORY_LIMIT: ${LOG_CATCHUP_HISTORY_LIMIT:-25}
      LOG_CATCHUP_INTERVAL_MS: ${LOG_CATCHUP_INTERVAL_MS:-5000}
      TI_SCRAPER_SERVICE_TOKEN: ${TI_SCRAPER_SERVICE_TOKEN:-}
      LOG_LIVE_WORKER_DISABLED: "1"
      DWM_WEBHOOK_LIVE_DELIVERY: ${DWM_WEBHOOK_LIVE_DELIVERY:-true}
      HANASAND_APP_UPDATE_DIR: /srv/hanasand/app-updates
      HOST_CONSOLE_SSH_KEY_PATH: /run/secrets/host-console
      HOST_CONSOLE_KNOWN_HOSTS_PATH: /run/secrets/host-console-known-hosts
      DOCKER_SOCKET_PATH: /host/run/docker.sock
      HOST_CONSOLE_INSPUR_HOST: ${HOST_CONSOLE_INSPUR_HOST:-128.39.142.218}
      HOST_CONSOLE_INSPUR_PORT: ${HOST_CONSOLE_INSPUR_PORT:-222}
      HOST_CONSOLE_OVH_HOST: ${HOST_CONSOLE_OVH_HOST:-192.99.32.185}
      HOST_CONSOLE_OVH_PORT: ${HOST_CONSOLE_OVH_PORT:-22}
      HOST_CONSOLE_OVH_USER: ${HOST_CONSOLE_OVH_USER:-ubuntu}
      DB_POOL_HOST: pgbouncer
      DB_POOL_PORT: ${DB_POOL_PORT:-18505}
      HANASAND_IDENTITY_SERVICE_URL: ${HANASAND_IDENTITY_SERVICE_URL:-http://identity:8081}
      DB_MAX_CONN: ${DB_MAX_CONN:-1000}
      DB_POOL_WARMUP_CONN: ${DB_POOL_WARMUP_CONN:-1000}
      LOG_CATCHUP_WORKER_DISABLED: "1"
      API_CORS_ALLOWED_ORIGINS: ${API_CORS_ALLOWED_ORIGINS:-https://hanasand.com,https://www.hanasand.com}
      MAIL_INTERNAL_URL: ${MAIL_INTERNAL_URL:-http://stalwart:8080}
      MAIL_HOST: ${MAIL_HOST:-mail.hanasand.com}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-hanasand.com}
      MAIL_ADMIN_USERNAME: ${MAIL_ADMIN_USERNAME:-admin}
      MAIL_ADMIN_PASSWORD: ${MAIL_ADMIN_PASSWORD:-}
      MAIL_PRIVILEGED_USERS: ${MAIL_PRIVILEGED_USERS:-admin,administrator,eirik,eirikhanasand}
      MAIL_USER_ALIASES: ${MAIL_USER_ALIASES:-eirikhanasand:eirik}
      MAIL_SYSTEM_MAILBOX_USER: ${MAIL_SYSTEM_MAILBOX_USER:-eirikhanasand}
      MAIL_SYSTEM_SENDER_LOCAL_PART: ${MAIL_SYSTEM_SENDER_LOCAL_PART:-noreply}
      MAIL_SYSTEM_ALIASES: ${MAIL_SYSTEM_ALIASES:-postmaster,abuse,hostmaster,tls-reports,noreply-dmarc}
      MAIL_IMAP_PORT: ${MAIL_IMAP_PORT:-993}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_INTERNAL_PORT: ${MAIL_SMTP_INTERNAL_PORT:-587}
      COMMERCIAL_CONTACT_RECIPIENT: ${COMMERCIAL_CONTACT_RECIPIENT:-eirik@hanasand.com}
      MAIL_MANAGESIEVE_PORT: ${MAIL_MANAGESIEVE_PORT:-4190}
      MANAGED_CRON_GID: ${MANAGED_CRON_GID:-990}
      VM_HOST_ID: ${VM_HOST_ID:-ovhcloud}
      ONION_SESSION_PROXY: ${ONION_SESSION_PROXY:-socks5://onion-tor:9050}
      BROWSER_SANDBOX_WORKER_NETWORK: ${BROWSER_SANDBOX_WORKER_NETWORK:-hanasand_browsernet}
      BROWSER_SANDBOX_MAX_SESSIONS: ${BROWSER_SANDBOX_MAX_SESSIONS:-100}
      BROWSER_SANDBOX_EGRESS_FIREWALL_READY: ${BROWSER_SANDBOX_EGRESS_FIREWALL_READY:-0}
      BROWSER_SANDBOX_PREWARM: "0"
      BROWSER_SANDBOX_WORKER_IMAGE: ${BROWSER_SANDBOX_WORKER_IMAGE:-hanasand_browsers:latest}
      VULNERABILITY_SCAN_STATE_PATH: ${VULNERABILITY_SCAN_STATE_PATH:-/var/lib/hanasand/vulnerability-scan.json}
      DB_BACKUP_WORKER_URL: ${DB_BACKUP_WORKER_URL:-http://hanasand_database_backup:18190}
      DB_BACKUP_WORKER_TOKEN: ${DB_BACKUP_WORKER_TOKEN:-}
      HANASAND_MODEL_CLIENT_HEALTH_BASE: ${HANASAND_MODEL_CLIENT_HEALTH_BASE:-http://host.docker.internal:18182}
      HANASAND_RELEASE_COMMIT: ${HANASAND_RELEASE_COMMIT:-unknown}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health"]
      start_period: 60s
      interval: 5s
      retries: 5
    networks:
      hanasandnet:
        # Public monitoring must not leave through the isolated browser bridge.
        gw_priority: 1
      pwnednet: {}
      browsernet: {}
      identity-proxy: {}
    depends_on:
      deploy-path-guard:
        condition: service_healthy
      postgres:
        condition: service_healthy

  api-candidate:
    extends:
      service: api
    container_name: ${HANASAND_API_CANDIDATE_CONTAINER:-hanasand_api_candidate}
    environment:
      API_HTTP_ONLY: "1"
      DEPLOYMENT_CANDIDATE_ONLY: "1"
      DB_POOL_HOST: hanasand_pgbouncer_candidate
    ports: !override
      - "127.0.0.1:${HANASAND_API_CANDIDATE_PORT:-8083}:8080"
    profiles: [deployment-candidates]

  discord-bot:
    container_name: hanasand_discord_bot
    image: hanasand_discord_bot
    build:
      context: .
      dockerfile: ./bot/Dockerfile
    init: true
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    environment:
      NODE_ENV: production
      PORT: 3000
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      HANASAND_DISCORD_SUPPORT_API_KEY: ${HANASAND_DISCORD_SUPPORT_API_KEY:-}
      HANASAND_API_BASE: ${HANASAND_API_BASE:-http://api:8080}
      DISCORD_SUPPORT_ROLE_ID: ${DISCORD_SUPPORT_ROLE_ID:-}
      DISCORD_SUPPORT_CATEGORY_ID: ${DISCORD_SUPPORT_CATEGORY_ID:-}
      SUPPORT_STATE_FILE: /data/support-state.json
    volumes:
      - discord_bot_state:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 30s
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - hanasandnet
    depends_on:
      api:
        condition: service_healthy
    profiles: [discord]

  browsers:
    container_name: hanasand_browsers
    image: ${BROWSER_SANDBOX_WORKER_IMAGE:-hanasand_browsers:latest}
    pull_policy: never
    mem_limit: 3g
    cpus: "3.0"
    init: true
    restart: always
    user: "1000"
    environment:
      NODE_ENV: production
      PORT: 8090
      HOME: /tmp
      DISPLAY: ":20"
      START_XFCE4: "false"
      BROWSER_STREAM_RESOLUTION: 1280x720
      SELKIES_ENABLE_BASIC_AUTH: "false"
      SELKIES_ENABLE_RESIZE: "false"
      SELKIES_ENCODER: vp8enc
      SELKIES_FRAMERATE: "30"
      SELKIES_VIDEO_BITRATE: "4000"
      BROWSER_SANDBOX_WORKER_ONLY: "1"
      BROWSER_SANDBOX_SKIP_RUN_DB: "1"
      BROWSER_SANDBOX_CHROMIUM_SANDBOX: "1"
      BROWSER_SANDBOX_MAX_SESSIONS: "1"
      BROWSER_SANDBOX_PREWARM: "0"
      ONION_SESSION_PROXY: ${ONION_SESSION_PROXY:-socks5://onion-tor:9050}
    expose:
      - "8080"
      - "8081"
      - "8090"
      - "9081"
    privileged: false
    ipc: private
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
      - /etc/nginx/sites-available:rw,noexec,nosuid,size=1m,uid=1000,gid=1000
      - /var/lib/nginx:rw,noexec,nosuid,size=16m,uid=1000,gid=1000
    cap_add: []
    cap_drop:
      - ALL
    security_opt:
      - seccomp=/home/hanasand/hanasand/ops/browser-worker/seccomp-chromium.json
      - apparmor=docker-default
      - no-new-privileges
    shm_size: "1gb"
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health && curl -fsS http://127.0.0.1:8090"]
      interval: 5s
      retries: 5
      start_period: 20s
    networks:
      - browsernet
    depends_on:
      deploy-path-guard:
        condition: service_healthy

  browser-turn:
    container_name: hanasand_browser_turn
    image: coturn/coturn:4.6.3-r3
    restart: always
    command:
      - --no-cli
      - --no-tls
      - --no-dtls
      - --fingerprint
      - --realm=hanasand.com
      - --use-auth-secret
      - --static-auth-secret=${BROWSER_SANDBOX_TURN_SECRET:-unsafe-dev-turn-secret}
      - --external-ip=${BROWSER_SANDBOX_TURN_HOST:-127.0.0.1}
      - --listening-port=3478
      - --min-port=49152
      - --max-port=49252
      - --no-multicast-peers
      - --log-file=stdout
    healthcheck:
      test: ["CMD", "turnutils_stunclient", "-p", "3478", "127.0.0.1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49152-49252:49152-49252/udp"
    cap_add:
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    networks:
      - browsernet

  postgres:
    image: postgres:15
    container_name: hanasand_database
    # Startup arguments also apply to restored volumes, overriding old ALTER SYSTEM values.
    command:
      - postgres
      - -c
      - shared_buffers=${DB_SHARED_BUFFERS:-32GB}
      - -c
      - track_activity_query_size=64kB
      - -c
      - effective_cache_size=48GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_wal_size=32GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=zstd
      - -c
      - wal_buffers=16MB
      - -c
      - max_slot_wal_keep_size=64GB
      - -c
      - gin_pending_list_limit=4MB
      - -c
      - bgwriter_lru_maxpages=100
      - -c
      - bgwriter_delay=200ms
      - -c
      - bgwriter_lru_multiplier=2
      - -c
      - fsync=on
      - -c
      - full_page_writes=on
      - -c
      - synchronous_commit=on
    # Parallel queries share memory here; Docker's 64 MiB default exhausts it.
    shm_size: "2gb"
    mem_limit: 256g
    memswap_limit: 256g
    cpus: "16.0"
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-hanasand}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB:-hanasand}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./ops/healthchecks/pg-readiness.sh:/usr/local/bin/pg_isready:ro
    ports:
      - "127.0.0.1:${DB_LOCAL_PORT:-8503}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanasand -d hanasand"]
      interval: 5s
      retries: 5
    networks:
      - hanasandnet
    depends_on:
      deploy-path-guard:
        condition: service_healthy

volumes:
  discord_bot_state:
  api_state:
  prompt_portal_state:
  postgres_data:
    external: true
    name: hanasand_postgres_data

networks:
  pwnednet:
    external: true
  hanasandnet:
    driver: bridge
  browsernet:
    name: hanasand_browsernet
    driver: bridge
  identity-proxy:
    external: true
    name: hanasand_identity_proxy
