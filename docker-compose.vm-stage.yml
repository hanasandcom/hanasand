services:
  vm-stage-postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: hanasand
      POSTGRES_USER: hanasand
      POSTGRES_PASSWORD: vm-stage-database-only
    volumes:
      - vm_stage_postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/00-hanasand.sql:ro
      - ./db/init:/docker-entrypoint-initdb.d/init:ro
      - ./staging/vm-stage/init/99-seed.sql:/docker-entrypoint-initdb.d/99-stage-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanasand -d hanasand"]
      interval: 5s
      retries: 12
    networks: [vm-stage]

  vm-stage-identity:
    image: node:22-alpine
    command: ["node", "/stage/identity-mock.mjs"]
    volumes:
      - ./staging/vm-stage/identity-mock.mjs:/stage/identity-mock.mjs:ro
    networks: [vm-stage]

  vm-stage-api:
    build:
      context: .
      additional_contexts:
        database_schema: ./db
      dockerfile: ./api/Dockerfile
      args:
        HANASAND_RELEASE_COMMIT: vm-stage
        HANASAND_STAGE_BUILD: "1"
    restart: unless-stopped
    environment:
      API_HTTP_ONLY: "1"
      DEPLOYMENT_CANDIDATE_ONLY: "1"
      API_CORS_ALLOWED_ORIGINS: http://127.0.0.1:3388
      DB: hanasand
      DB_USER: hanasand
      DB_PASSWORD: vm-stage-database-only
      DB_HOST: vm-stage-postgres
      DB_PORT: "5432"
      DB_POOL_HOST: vm-stage-postgres
      DB_POOL_PORT: "5432"
      DB_MAX_CONN: "10"
      VM_API_TOKEN: vm-stage-internal-only
      VM_HOST_ID: ovhcloud
      LXD_PROJECT: hanasand-vm-stage-candidate
      HANASAND_IDENTITY_SERVICE_URL: http://vm-stage-identity:8081
      HANASAND_IDENTITY_SERVICE_TOKEN: vm-stage-identity-only
      FRONTEND_URL: http://127.0.0.1:3388
      MAIL_HOST: vm-stage.invalid
      MAIL_INTERNAL_URL: http://127.0.0.1:9
      AI_API_BASE: http://127.0.0.1:9
    ports:
      - "127.0.0.1:8388:8080"
    volumes:
      - /var/snap/lxd/common/lxd/unix.socket:/var/snap/lxd/common/lxd/unix.socket
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health"]
      start_period: 60s
      interval: 5s
      retries: 12
    depends_on:
      vm-stage-postgres:
        condition: service_healthy
      vm-stage-identity:
        condition: service_started
    networks: [vm-stage]

  vm-stage-frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        HANASAND_RELEASE_COMMIT: vm-stage
        HANASAND_STAGE_BUILD: "1"
        FRONTEND_INTERNAL_API: http://vm-stage-api:8080/api
        NEXT_PUBLIC_API: http://127.0.0.1:8388/api
        NEXT_PUBLIC_API_WS: ws://127.0.0.1:8388/api/ws
        NEXT_PUBLIC_AI_API_WS: ws://127.0.0.1:8389/api
    restart: unless-stopped
    environment:
      FRONTEND_INTERNAL_API: http://vm-stage-api:8080/api
      FRONTEND_INTERNAL_AI_API: http://127.0.0.1:9/api
      FRONTEND_AUTH_API: http://vm-stage-api:8080/api
      FRONTEND_IDENTITY_API: http://vm-stage-identity:8081/api
      FRONTEND_RELEASE_COMMIT: vm-stage
      HANASAND_VM_STAGE: "1"
      SOCIAL_AUTH_ORIGIN: http://127.0.0.1:3388
    ports:
      - "127.0.0.1:3388:3000"
    depends_on:
      vm-stage-api:
        condition: service_healthy
    networks: [vm-stage]

  vm-stage-login:
    image: node:22-alpine
    command: ["node", "/stage/login-server.mjs"]
    volumes:
      - ./staging/vm-stage/login-server.mjs:/stage/login-server.mjs:ro
      - ./staging/vm-stage/login.html:/stage/login.html:ro
    ports:
      - "127.0.0.1:3390:3190"
    networks: [vm-stage]

volumes:
  vm_stage_postgres:

networks:
  vm-stage:
    driver: bridge
