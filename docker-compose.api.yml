services:
  api:
    container_name: hanasand_api
    image: hanasand_api
    mem_limit: 2g
    cpus: "2.0"
    restart: always
    build:
      context: .
      additional_contexts:
        database_schema: ./db
      dockerfile: ./api/Dockerfile
      args:
        HANASAND_RELEASE_COMMIT: ${HANASAND_RELEASE_COMMIT:-unknown}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
      # Keep the stable host-side API port used by the production proxy.
      - "127.0.0.1:8082:8080"
    env_file:
      - ${HANASAND_DEPLOY_ENV_FILE:-.env}
    volumes:
      # Mount the directory so a Docker daemon restart can replace docker.sock
      # without leaving this container attached to the deleted socket inode.
      - /run:/host/run:ro
      - /var/snap/lxd/common/lxd/unix.socket:/var/snap/lxd/common/lxd/unix.socket
      - /var/spool/cron/crontabs:/host/cron/crontabs
      - /var/lib/hanasand:/host/var/lib/hanasand:ro
      - /var/lib/hanasand/docker-storage:/var/lib/hanasand/docker-storage
      - /var/lib/hanasand/support:/var/lib/hanasand-support:ro
      - api_state:/var/lib/hanasand
      - ${HANASAND_APP_UPDATE_DIR:-/srv/hanasand/app-updates}:/srv/hanasand/app-updates
      - ${HOST_CONSOLE_SSH_KEY_FILE:-/home/hanasand/.ssh/host-console}:/run/secrets/host-console:ro
      - ${HOST_CONSOLE_KNOWN_HOSTS_FILE:-/home/hanasand/.ssh/host-console-known-hosts}:/run/secrets/host-console-known-hosts:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TI_SCRAPER_API_BASE: ${TI_SCRAPER_API_BASE:-http://ti-scraper:8097}
      LOG_CATCHUP_BATCH_LIMIT: ${LOG_CATCHUP_BATCH_LIMIT:-25}
      LOG_CATCHUP_HISTORY_LIMIT: ${LOG_CATCHUP_HISTORY_LIMIT:-25}
      LOG_CATCHUP_INTERVAL_MS: ${LOG_CATCHUP_INTERVAL_MS:-5000}
      TI_SCRAPER_SERVICE_TOKEN: ${TI_SCRAPER_SERVICE_TOKEN:-}
      LOG_LIVE_WORKER_DISABLED: "1"
      DWM_WEBHOOK_LIVE_DELIVERY: ${DWM_WEBHOOK_LIVE_DELIVERY:-true}
      HANASAND_APP_UPDATE_DIR: /srv/hanasand/app-updates
      HOST_CONSOLE_SSH_KEY_PATH: /run/secrets/host-console
      HOST_CONSOLE_KNOWN_HOSTS_PATH: /run/secrets/host-console-known-hosts
      DOCKER_SOCKET_PATH: /host/run/docker.sock
      HOST_CONSOLE_INSPUR_HOST: ${HOST_CONSOLE_INSPUR_HOST:-128.39.142.218}
      HOST_CONSOLE_INSPUR_PORT: ${HOST_CONSOLE_INSPUR_PORT:-222}
      HOST_CONSOLE_OVH_HOST: ${HOST_CONSOLE_OVH_HOST:-192.99.32.185}
      HOST_CONSOLE_OVH_PORT: ${HOST_CONSOLE_OVH_PORT:-22}
      HOST_CONSOLE_OVH_USER: ${HOST_CONSOLE_OVH_USER:-ubuntu}
      DB_POOL_HOST: pgbouncer
      DB_POOL_PORT: ${DB_POOL_PORT:-18505}
      HANASAND_IDENTITY_FDW_HOST: identity-postgres
      HANASAND_IDENTITY_FDW_PORT: "5432"
      HANASAND_IDENTITY_SERVICE_URL: ${HANASAND_IDENTITY_SERVICE_URL:-http://identity:8081}
      AI_API_BASE: ${AI_API_BASE:-http://ai:19182}
      SUPPORT_SERVICE_KEY: ${SUPPORT_SERVICE_KEY:-}
      HANASAND_IDENTITY_SERVICE_TOKEN: ${HANASAND_IDENTITY_SERVICE_TOKEN:-}
      # Keep the API pool budget aligned with PostgreSQL's 100-connection cap.
      DB_MAX_CONN: ${DB_MAX_CONN:-100}
      DB_POOL_WARMUP_CONN: ${DB_POOL_WARMUP_CONN:-8}
      LOG_CATCHUP_WORKER_DISABLED: "1"
      API_CORS_ALLOWED_ORIGINS: ${API_CORS_ALLOWED_ORIGINS:-https://hanasand.com,https://www.hanasand.com}
      MAIL_INTERNAL_URL: ${MAIL_INTERNAL_URL:-http://stalwart:8080}
      MAIL_HOST: ${MAIL_HOST:-mail.hanasand.com}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-hanasand.com}
      MAIL_ADMIN_USERNAME: ${MAIL_ADMIN_USERNAME:-admin}
      MAIL_ADMIN_PASSWORD: ${MAIL_ADMIN_PASSWORD:-}
      MAIL_PRIVILEGED_USERS: ${MAIL_PRIVILEGED_USERS:-admin,administrator,eirik,eirikhanasand}
      MAIL_USER_ALIASES: ${MAIL_USER_ALIASES:-eirikhanasand:eirik}
      MAIL_SYSTEM_MAILBOX_USER: ${MAIL_SYSTEM_MAILBOX_USER:-eirikhanasand}
      MAIL_SYSTEM_SENDER_LOCAL_PART: ${MAIL_SYSTEM_SENDER_LOCAL_PART:-noreply}
      MAIL_SYSTEM_ALIASES: ${MAIL_SYSTEM_ALIASES:-postmaster,abuse,hostmaster,tls-reports,noreply-dmarc}
      MAIL_IMAP_PORT: ${MAIL_IMAP_PORT:-993}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_INTERNAL_PORT: ${MAIL_SMTP_INTERNAL_PORT:-587}
      COMMERCIAL_CONTACT_RECIPIENT: ${COMMERCIAL_CONTACT_RECIPIENT:-eirik@hanasand.com}
      MAIL_MANAGESIEVE_PORT: ${MAIL_MANAGESIEVE_PORT:-4190}
      MANAGED_CRON_GID: ${MANAGED_CRON_GID:-990}
      VM_HOST_ID: ${VM_HOST_ID:-inspur}
      ONION_SESSION_PROXY: ${ONION_SESSION_PROXY:-socks5://onion-tor:9050}
      BROWSER_SANDBOX_WORKER_NETWORK: ${BROWSER_SANDBOX_WORKER_NETWORK:-hanasand_browsernet}
      BROWSER_SANDBOX_MAX_SESSIONS: ${BROWSER_SANDBOX_MAX_SESSIONS:-100}
      BROWSER_SANDBOX_EGRESS_FIREWALL_READY: ${BROWSER_SANDBOX_EGRESS_FIREWALL_READY:-0}
      BROWSER_SANDBOX_PREWARM: "0"
      BROWSER_SANDBOX_WORKER_IMAGE: ${BROWSER_SANDBOX_WORKER_IMAGE:-hanasand_browsers:latest}
      VULNERABILITY_SCAN_STATE_PATH: ${VULNERABILITY_SCAN_STATE_PATH:-/var/lib/hanasand/vulnerability-scan.json}
      HANASAND_SCANNER_URL: ${HANASAND_SCANNER_URL:-http://scanner:18200}
      HANASAND_SCANNER_SERVICE_TOKEN: ${HANASAND_SCANNER_SERVICE_TOKEN:-}
      DB_BACKUP_WORKER_URL: ${DB_BACKUP_WORKER_URL:-http://hanasand_database_backup:18190}
      DB_BACKUP_WORKER_TOKEN: ${DB_BACKUP_WORKER_TOKEN:-}
      HANASAND_MODEL_CLIENT_HEALTH_BASE: ${HANASAND_MODEL_CLIENT_HEALTH_BASE:-http://host.docker.internal:18182}
      HANASAND_RELEASE_COMMIT: ${HANASAND_RELEASE_COMMIT:-unknown}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health"]
      start_period: 60s
      interval: 5s
      retries: 5
    networks:
      hanasandnet:
        # Public monitoring must not leave through the isolated browser bridge.
        gw_priority: 1
      pwnednet: {}
      browsernet: {}
      identity-proxy: {}
    depends_on:
      deploy-path-guard:
        condition: service_healthy
      postgres:
        condition: service_healthy

  api-candidate:
    extends:
      service: api
    container_name: ${HANASAND_API_CANDIDATE_CONTAINER:-hanasand_api_candidate}
    environment:
      API_HTTP_ONLY: "1"
      DEPLOYMENT_CANDIDATE_ONLY: "1"
      DB_POOL_HOST: hanasand_pgbouncer_candidate
    ports: !override
      - "127.0.0.1:${HANASAND_API_CANDIDATE_PORT:-8083}:8080"
    profiles: [deployment-candidates]
