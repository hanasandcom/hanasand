# Extra guardrails for the VM rehearsal stack on Inspur. This is staging-only;
# every local LXD request is scoped to the restricted hns-stage project.
services:
  vm-stage-api:
    build:
      args:
        HANASAND_RELEASE_COMMIT: ${HANASAND_RELEASE_COMMIT:-vm-stage}
    environment:
      LXD_PROJECT: hns-stage
      AI_API_BASE: http://hanasand_ai_staging_api:19182
      SUPPORT_SERVICE_KEY: ${SUPPORT_SERVICE_KEY:?staging-only support key required}
      PUBLIC_STATUS_INGEST_URL: ${PUBLIC_STATUS_INGEST_URL:-https://status.hanasand.com/api/monitoring/ingest}
      PUBLIC_STATUS_INGEST_TOKEN: ${VM_STATUS_INGEST_TOKEN:?dedicated staging VM status ingest token required}
      VM_LIFECYCLE_MONITOR_ENABLED: "true"
      VM_LIFECYCLE_MONITOR_TARGET: isolated-staging
      VM_LIFECYCLE_MONITOR_SOCKET_PATH: /var/snap/lxd/common/lxd/unix.socket
      VM_LIFECYCLE_MONITOR_PROJECT: hns-stage
      VM_LIFECYCLE_MONITOR_IMAGE_SERVER: https://images.lxd.canonical.com
      VM_LIFECYCLE_MONITOR_IMAGE_ALIAS: ubuntu/24.04/desktop
    networks:
      - vm-stage
      - ai-staging
  vm-stage-frontend:
    environment:
      FRONTEND_INTERNAL_AI_API: http://hanasand_ai_staging_api:19182/api
    networks:
      - vm-stage
      - ai-staging

networks:
  ai-staging:
    external: true
    name: hanasand_ai_staging_internal
